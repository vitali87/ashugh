name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  skill:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/build_skill.py
      - name: Smoke-test the bundled skill
        run: |
          cd "$(mktemp -d)"
          unzip -q "$GITHUB_WORKSPACE/dist/ashugh-skill.zip"
          python3 ashugh/scripts/run_ashugh.py syl Մկրտիչ | grep -q "Մը-կըր-տի"
      - uses: actions/upload-artifact@v4
        with:
          name: ashugh-skill
          path: dist/ashugh-skill.zip
