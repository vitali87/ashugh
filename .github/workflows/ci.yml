name: ci

on:
  push:
  pull_request:
  workflow_dispatch:  # run by hand from the Actions tab

concurrency:  # a new push cancels the run of the commit it replaces
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.14"
            extras: all
          - python: "3.15"  # beta: OR-Tools has no 3.15 wheels yet
            extras: claude
    continue-on-error: ${{ matrix.python == '3.15' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra ${{ matrix.extras }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run pytest -q

  skill:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv run scripts/build_skill.py
      - name: Smoke-test the bundled skill
        run: |
          cd "$(mktemp -d)"
          unzip -q "$GITHUB_WORKSPACE/dist/ashugh-skill.zip"
          uv run ashugh/scripts/run_ashugh.py syl Մկրտիչ | grep -q "Մը-կըր-տի"
      - uses: actions/upload-artifact@v4
        with:
          name: ashugh-skill
          path: dist/ashugh-skill.zip
